name: 'Container Merge and Publish'
description: 'GitHub Action to tag the per-platform images pushed by digest as one multi-platform image'
inputs:
  workdir:
    description: "Working directory of bake execution"
    required: false
    default: '.'
  dockerhub-username:
    description: 'Username used to log against the Docker registry'
    required: false
    default: ''
  dockerhub-password:
    description: 'Password or personal access token used to log against the Docker registry'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Get the digest artifact pattern
      id: artifact
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
      run: |
        workdir="${WORKDIR#./}"
        echo "pattern=digests-${workdir//\//-}__*" >> "$GITHUB_OUTPUT"

    - name: Download the digests
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ steps.artifact.outputs.pattern }}
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Create the multi-platform tags
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        shopt -s nullglob
        digest_files=("${RUNNER_TEMP}"/digests/*.json)
        json_data="$(docker buildx bake default --print 2>/dev/null)"
        for target in $(echo "$json_data" | jq -r '.target | keys[]'); do
          mapfile -t tags < <(echo "$json_data" | jq -r --arg t "$target" '.target[$t].tags[]')
          platforms="$(echo "$json_data" | jq -r --arg t "$target" '.target[$t].platforms | length')"
          repo="$(echo "${tags[0]}" | sed 's/:[^:/]*$//')"
          digests=()
          if [ "${#digest_files[@]}" -gt 0 ]; then
            mapfile -t digests < <(jq -r --arg t "$target" '.[$t] // empty' "${digest_files[@]}")
          fi
          # Don't publish a tag that's missing a platform
          if [ "${#digests[@]}" -ne "$platforms" ]; then
            echo "::error::${target}: expected ${platforms} platform digests, got ${#digests[@]}"
            exit 1
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          for digest in "${digests[@]}"; do
            args+=("${repo}@${digest}")
          done
          echo "==> ${target}: ${tags[*]}"
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
        done

    - name: Get the image name
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        echo "image_name=$($(git rev-parse --show-toplevel)/bin/image-name.sh)" >> $GITHUB_ENV

    - name: Get the image description
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        echo "image_description=$($(git rev-parse --show-toplevel)/bin/image-description.sh)" >> $GITHUB_ENV

    - name: Get the image readme filepath
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        echo "image_readme_filepath=$($(git rev-parse --show-toplevel)/bin/image-readme.sh)" >> $GITHUB_ENV

    - name: Update Docker Hub Description
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
        repository: boxcutter/${{ env.image_name }}
        short-description: ${{ env.image_description }}
        readme-filepath: ${{ env.image_readme_filepath }}
